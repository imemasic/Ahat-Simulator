  #village { position:absolute;left:50%;top:50%;width:clamp(330px,29vw,570px);aspect-ratio:432/310;transform:translate(-50%,-50%);z-index:6;cursor:pointer;filter:drop-shadow(0 16px 22px rgba(0,0,0,.28)); }
  #village img { width:100%;height:100%;object-fit:contain;display:block;pointer-events:none; }
  #villageRing { position:absolute;left:50%;top:52%;width:111%;height:78%;border:clamp(7px,.68vw,13px) solid rgba(255,248,187,.98);border-radius:50%;transform:translate(-50%,-50%) rotate(-1deg);opacity:0;transition:opacity .14s ease,filter .14s ease,transform .14s ease;pointer-events:none;box-shadow:0 0 14px rgba(255,248,180,.34),inset 0 0 9px rgba(255,255,216,.25);filter:drop-shadow(0 3px 2px rgba(0,0,0,.34)); }
  #village:hover #villageRing { opacity:1;transform:translate(-50%,-50%) rotate(-1deg) scale(1.012); }

  #actors { position:absolute;inset:0;z-index:12;pointer-events:none; }
  .caravan { position:absolute;width:104px;height:90px;margin-left:-52px;margin-top:-45px;transform-origin:center;pointer-events:auto;cursor:crosshair;filter:drop-shadow(0 7px 7px rgba(0,0,0,.60)); }
  .caravan .hover-ring { position:absolute;left:50%;top:57%;width:106px;height:63px;transform:translate(-50%,-50%);border:5px solid rgba(232,48,35,.98);border-radius:50%;opacity:0;transition:opacity .08s ease,box-shadow .08s ease;box-shadow:0 0 11px rgba(224,30,25,.72),inset 0 0 8px rgba(224,30,25,.3); }
  .caravan:hover .hover-ring { opacity:1; }
  .caravan svg { position:absolute;inset:3px;width:98px;height:84px;overflow:visible; }
  .caravan.hit { animation:hitPop .18s ease-out forwards;pointer-events:none; }
  @keyframes hitPop { from{transform:scale(1);opacity:1} to{transform:scale(1.34);opacity:0} }

  .event-npc { position:absolute;width:112px;height:116px;margin-left:-56px;margin-top:-58px;z-index:18;pointer-events:none;filter:drop-shadow(0 8px 9px rgba(0,0,0,.66));transition:opacity .28s ease; }
  .event-npc svg { position:absolute;left:8px;top:20px;width:96px;height:96px;overflow:visible; }
  .event-npc.hidden-in-village { opacity:0; }
  .event-banner { position:absolute;left:50%;top:-32px;width:58px;height:45px;transform:translateX(-50%);display:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.62)); }
  .event-banner.visible { display:block; }
  .event-banner::after { content:"";position:absolute;left:50%;top:40px;width:3px;height:31px;background:#4a3525;transform:translateX(-50%);box-shadow:0 0 1px rgba(0,0,0,.9);z-index:-1; }
  .event-banner img { width:100%;height:100%;object-fit:contain;display:block; }
  .enemy-label { position:absolute;left:50%;top:-18px;transform:translateX(-50%);white-space:nowrap;color:#e7372f;font-size:clamp(18px,1.55vw,28px);font-weight:900;letter-spacing:.02em;text-shadow:0 2px 2px rgba(0,0,0,.98),0 0 7px rgba(0,0,0,.92),0 0 3px #7f0d09; }

  #vacationEnd { position:absolute;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;padding:6vw;background:rgba(8,9,7,.82);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .45s ease; }
  #vacationEnd.active { opacity:1;pointer-events:auto; }
  .vacation-message { max-width:1500px;text-align:center;color:#f2ead4;font-size:clamp(38px,5vw,92px);font-weight:900;line-height:1.08;letter-spacing:.01em;text-shadow:0 4px 4px rgba(0,0,0,.8),0 0 24px rgba(0,0,0,.8);opacity:0;transform:scale(.96);transition:opacity .65s ease .12s,transform .65s ease .12s; }
  #vacationEnd.active .vacation-message { opacity:1;transform:scale(1); }

  #hud { position:absolute;right:clamp(24px,2.4vw,52px);top:clamp(16px,2.5vh,36px);z-index:30;width:clamp(205px,16vw,290px);height:clamp(135px,11vw,200px);pointer-events:none;filter:drop-shadow(0 7px 7px rgba(0,0,0,.56)); }
  #hud img { position:absolute;right:0;top:0;height:100%;width:auto;max-width:48%;object-fit:contain; }
  #score { position:absolute;right:calc(48% + clamp(18px,1.6vw,30px));top:49%;transform:translateY(-50%);min-width:62px;text-align:center;color:#fff6dc;font-size:clamp(30px,2.8vw,50px);font-weight:900;line-height:1;text-shadow:0 2px 2px #19130d,0 0 8px rgba(0,0,0,.92); }
  .plus-one { position:absolute;right:calc(48% + clamp(18px,1.6vw,30px));top:42%;color:#f7ead0;font-weight:900;font-size:clamp(25px,2.4vw,43px);text-shadow:0 2px 2px #1f1008,0 0 7px rgba(0,0,0,.9);animation:scoreFloat .85s ease-out forwards; }
  @keyframes scoreFloat { 0%{opacity:0;transform:translate(0,12px) scale(.72)}22%{opacity:1;transform:translate(-10px,-3px) scale(1.08)}100%{opacity:0;transform:translate(-18px,-48px) scale(.96)} }

  #defeat { position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(6,7,6,.28);opacity:0;pointer-events:none;transition:opacity .2s ease; }

  .defeat-vignette { position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,29,33,.18),transparent 32%,rgba(12,10,7,.14));pointer-events:none; }
  .defeat-content { position:absolute;left:5%;right:5%;top:4.5%;z-index:2;color:#f4f0da;text-shadow:0 2px 2px rgba(0,0,0,.56); }
  .defeat-title { margin:0 0 28px;font-size:clamp(28px,3.2vw,52px);line-height:1.08;font-weight:700;letter-spacing:.01em; }
  .restart { appearance:none;width:100%;border:0;border-bottom:2px solid rgba(225,226,213,.48);background:transparent;color:#f3f1e4;display:flex;align-items:center;gap:20px;padding:11px 0 15px;cursor:pointer;text-align:left;font-size:clamp(24px,2.6vw,43px);font-weight:600;text-shadow:0 2px 2px rgba(0,0,0,.6); }
  .restart-arrow { display:inline-flex;width:48px;height:48px;align-items:center;justify-content:center;font-size:clamp(40px,4vw,64px);line-height:1;color:#dddcd1;transition:filter .08s ease,color .08s ease,transform .08s ease;transform:translateY(-2px); }
  .restart:hover .restart-arrow { color:#fffef4;filter:brightness(1.2); }
  .restart:active .restart-arrow { color:#aaa89f;filter:brightness(.72);transform:translateY(-1px) scale(.96); }
  .restart:focus-visible { outline:2px solid rgba(255,246,190,.7);outline-offset:5px; }

  #intro { position:absolute;inset:0;z-index:200;background:rgba(0,0,0,.965);display:flex;align-items:center;justify-content:center;opacity:1;pointer-events:auto;transition:opacity .8s ease; }
  #intro.done { opacity:0;pointer-events:none; }
  .welcome-stage { position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .65s ease; }
  .welcome-stage.hide { opacity:0;pointer-events:none; }
  .welcome-line { width:min(94vw,1500px);display:flex;flex-wrap:wrap;justify-content:center;gap:.25em;text-align:center;color:#f4ecd3;font-size:clamp(40px,6.4vw,112px);font-weight:700;line-height:1.08;letter-spacing:.015em;text-shadow:0 4px 14px rgba(0,0,0,.95),0 0 30px rgba(199,157,90,.16); }
  .welcome-line span { opacity:0;transform:translateY(22px) scale(.985);filter:blur(6px);animation:wordIn .92s ease forwards; }
  .welcome-line span:nth-child(1){animation-delay:.15s}.welcome-line span:nth-child(2){animation-delay:.82s}.welcome-line span:nth-child(3){animation-delay:1.49s}.welcome-line span:nth-child(4){animation-delay:2.16s}.welcome-line span:nth-child(5){animation-delay:2.83s}
  @keyframes wordIn { to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)} }

  .clan-stage { opacity:0;pointer-events:none;transform:translateY(16px) scale(.985);transition:opacity .65s ease,transform .65s ease; }
  .clan-stage.show { opacity:1;pointer-events:auto;transform:translateY(0) scale(1); }
  .clan-panel { width:min(620px,90vw);padding:34px 38px 30px;border:2px solid rgba(119,111,92,.88);border-radius:8px;background:linear-gradient(180deg,rgba(44,58,65,.98),rgba(28,38,43,.98));box-shadow:0 28px 70px rgba(0,0,0,.72),inset 0 0 0 5px rgba(108,96,73,.26);color:#eee8d4;text-align:center; }
  .clan-panel h2 { margin:0 0 10px;font-size:clamp(30px,4vw,50px);font-weight:700; }
  .clan-panel p { margin:0 0 24px;color:#cfc9b7;font-size:17px;line-height:1.4; }
  .flag-preview { width:170px;height:112px;margin:0 auto 20px;border:1px solid rgba(239,230,198,.38);background:rgba(7,9,8,.34);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 16px rgba(0,0,0,.38); }
  .flag-preview img { width:100%;height:100%;object-fit:contain;display:none; }
  .flag-preview img.ready { display:block; }
  .flag-placeholder { color:#aaa48f;font-size:14px;text-transform:uppercase;letter-spacing:.1em; }
  .clan-actions { display:flex;gap:14px;justify-content:center;flex-wrap:wrap; }
  .clan-btn { border:1px solid rgba(220,212,184,.52);background:rgba(105,92,66,.34);color:#f4edd7;padding:12px 21px;min-width:170px;cursor:pointer;transition:filter .1s ease,background .1s ease,transform .08s ease; }
  .clan-btn:hover { filter:brightness(1.18);background:rgba(127,109,75,.45); }
  .clan-btn:active { transform:translateY(1px);filter:brightness(.78); }
  #flagInput { position:absolute;width:1px;height:1px;opacity:0;pointer-events:none; }

  @media (max-width:720px) {
    #village { width:61vw; }
    .caravan { width:88px;height:76px;margin-left:-44px;margin-top:-38px; }
    .caravan .hover-ring { width:90px;height:54px; }
    .caravan svg { width:82px;height:70px; }
    .event-npc { width:94px;height:100px;margin-left:-47px;margin-top:-50px; }
    .event-npc svg { width:82px;height:82px;left:6px;top:18px; }
    #hud { width:190px;height:130px;right:14px;top:10px; }
    .defeat-panel { width:90vw;height:82vh; }
    .clan-panel { padding:28px 22px 24px; }
  }
</style>

  let nextEventScore=EVENT_EVERY_SCORE;

  const caravanSVG=`
    <svg viewBox="0 0 100 80" aria-hidden="true">

    </svg>`;

  function centerPoint(){
    const r=village.getBoundingClientRect();
    return {x:r.left+r.width/2,y:r.top+r.height/2};
  }

  function randomTargetFrom(center){
    const angle=Math.random()*Math.PI*2;
    const radius=Math.hypot(innerWidth,innerHeight)*.73+260;
    return {x:center.x+Math.cos(angle)*radius,y:center.y+Math.sin(angle)*radius,angle};
  }

  function randomOffscreenPoint(pad=120){
    const side=Math.floor(Math.random()*4);
    if(side===0) return {x:Math.random()*innerWidth,y:-pad};
    if(side===1) return {x:innerWidth+pad,y:Math.random()*innerHeight};
    if(side===2) return {x:Math.random()*innerWidth,y:innerHeight+pad};
    return {x:-pad,y:Math.random()*innerHeight};
  }

  function animateActor(obj,from,to,duration,onDone){
    const start=performance.now();
    obj.x=from.x;obj.y=from.y;
    const token={cancelled:false};
    animations.add(token);
    function frame(now){
      if(token.cancelled||gameOver){animations.delete(token);return;}
      const t=Math.min(1,(now-start)/duration);
      const eased=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
      obj.x=from.x+(to.x-from.x)*eased;
      obj.y=from.y+(to.y-from.y)*eased;
      obj.el.style.left=obj.x+'px';obj.el.style.top=obj.y+'px';
      if(t<1) requestAnimationFrame(frame);
      else {animations.delete(token);if(onDone)onDone();}
    }
    requestAnimationFrame(frame);
    return token;
  }

  function spawnWave(){
    if(gameOver||!gameStarted)return;
    const c=centerPoint();
    activeWave={id:++waveSerial,finished:0};
    for(let i=0;i<CARAVANS_PER_WAVE;i++){
      const el=document.createElement('div');
      el.className='caravan';
      el.innerHTML='<div class="hover-ring"></div>'+caravanSVG;
      actors.appendChild(el);
      const jitter={x:(Math.random()-.5)*34,y:(Math.random()-.5)*25};
      const from={x:c.x+jitter.x,y:c.y+jitter.y};
      const target=randomTargetFrom(c);
      const actor={el,waveId:activeWave.id,done:false,x:from.x,y:from.y,token:null};
      el.style.left=from.x+'px';el.style.top=from.y+'px';
      const deg=target.angle*180/Math.PI+90;
      el.querySelector('svg').style.transform=`rotate(${deg}deg)`;
      el.addEventListener('click',ev=>{ev.stopPropagation();hitCaravan(actor);});
      const duration=8200+Math.random()*3800;
      actor.token=animateActor(actor,from,target,duration,()=>escapeCaravan(actor));
    }
  }

  function finishCaravan(actor,escapedOne){
    if(actor.done)return;
    actor.done=true;
    if(actor.token)actor.token.cancelled=true;
    if(escapedOne)escaped++;
    setTimeout(()=>actor.el.remove(),escapedOne?0:170);
    if(!activeWave||activeWave.id!==actor.waveId)return;
    activeWave.finished++;
    if(activeWave.finished>=CARAVANS_PER_WAVE)finishWave();
  }

  function eventDangerIsActive(){
    return !!eventNpc && ['entering','inside','leaving'].includes(eventNpc.state);
  }

  function hitCaravan(actor){
    if(gameOver||actor.done)return;
    if(eventDangerIsActive()){
      lose();
      return;
    }
    actor.el.classList.add('hit');
    score++;
    scoreEl.textContent=score;
    showPlusOne();

    // Особый человек появляется после каждых 23 набранных очков: 23, 46, 69...
    if(score>=nextEventScore && !eventNpc){
      nextEventScore+=EVENT_EVERY_SCORE;
      spawnEventNpc();
    }

    finishCaravan(actor,false);
    if(score>=VACATION_SCORE){
      triggerVacationEnding();
    }
  }

  function escapeCaravan(actor){finishCaravan(actor,true);}

  function showPlusOne(){
    const p=document.createElement('div');p.className='plus-one';p.textContent='+1';hud.appendChild(p);setTimeout(()=>p.remove(),900);
  }

  function finishWave(){
    waveCount++;
    activeWave=null;
    if(eventNpc&&eventNpc.state==='inside'&&waveCount>=eventNpc.leaveAtWave){departEventNpc();}
    if(!gameOver)waveTimer=setTimeout(spawnWave,NEXT_WAVE_DELAY);
  }

  function makeEventNpcElement(){
    const el=document.createElement('div');
    el.className='event-npc';
    if(clanFlagData){
      const banner=document.createElement('div');
      banner.className='event-banner visible';
      const img=document.createElement('img');img.src=clanFlagData;img.alt='Флаг клана';banner.appendChild(img);
      el.appendChild(banner);
    }else{
      const enemy=document.createElement('div');
      enemy.className='enemy-label';
      enemy.textContent='Враг';
      el.appendChild(enemy);
    }
    el.insertAdjacentHTML('beforeend',eventSVG);
    actors.appendChild(el);
    return el;
  }

  function spawnEventNpc(){
    const start=randomOffscreenPoint(150);
    const c=centerPoint();
    const stop={x:c.x,y:c.y+6};
    const el=makeEventNpcElement();
    const npc={el,state:'entering',start,stop,leaveAtWave:waveCount+EVENT_STAYS_WAVES,token:null,x:start.x,y:start.y};
    eventNpc=npc;
    el.style.left=start.x+'px';el.style.top=start.y+'px';
    npc.token=animateActor(npc,start,stop,5200,()=>{
      if(!eventNpc||gameOver)return;
      npc.state='inside';
      npc.el.classList.add('hidden-in-village');
      npc.x=stop.x;npc.y=stop.y;
    });
  }

  function departEventNpc(){
    if(!eventNpc||eventNpc.state!=='inside')return;
    const npc=eventNpc;
    npc.state='leaving';
    const c=centerPoint();
    npc.x=c.x;npc.y=c.y+6;
    npc.el.style.left=npc.x+'px';npc.el.style.top=npc.y+'px';
    npc.el.classList.remove('hidden-in-village');
    const end=randomOffscreenPoint(160);
    npc.token=animateActor(npc,{x:npc.x,y:npc.y},end,5200,()=>{
      npc.el.remove();
      if(eventNpc===npc)eventNpc=null;
    });
  }

  function triggerVacationEnding(){
    if(gameOver)return;
    gameOver=true;
    clearTimeout(waveTimer);
    animations.forEach(t=>t.cancelled=true);animations.clear();
    vacationEnd.classList.add('active');
    clearTimeout(vacationTimer);
    vacationTimer=setTimeout(()=>{
      vacationEnd.classList.remove('active');
      resetGame();
    },VACATION_MESSAGE_TIME);
  }

  function lose(){
    if(gameOver)return;
    gameOver=true;
    clearTimeout(waveTimer);
    animations.forEach(t=>t.cancelled=true);animations.clear();
    game.classList.add('game-over');
    restartBtn.focus({preventScroll:true});
  }

  function resetGame(){
    clearTimeout(waveTimer);
    clearTimeout(vacationTimer);
    vacationTimer=null;
    animations.forEach(t=>t.cancelled=true);animations.clear();
    actors.innerHTML='';
    score=0;escaped=0;waveCount=0;waveSerial=0;activeWave=null;eventNpc=null;gameOver=false;nextEventScore=EVENT_EVERY_SCORE;
    scoreEl.textContent='0';
    game.classList.remove('game-over');
    vacationEnd.classList.remove('active');
    if(gameStarted)setTimeout(spawnWave,700);
  }

  function beginGame(){
    if(gameStarted)return;
    gameStarted=true;
    intro.classList.add('done');
    setTimeout(()=>{intro.style.display='none';},850);
    resetGame();
  }

  function showClanPanel(){
    welcomeStage.classList.add('hide');
    setTimeout(()=>clanStage.classList.add('show'),420);
  }

  setTimeout(showClanPanel,4100);

  chooseFlag.addEventListener('click',()=>flagInput.click());
  flagInput.addEventListener('change',()=>{
    const file=flagInput.files&&flagInput.files[0];
    if(!file)return;
    if(!file.type.startsWith('image/'))return;
    const reader=new FileReader();
    reader.onload=()=>{
      clanFlagData=String(reader.result||'');
      flagPreview.src=clanFlagData;
      flagPreview.classList.add('ready');
      flagPlaceholder.style.display='none';
    };
    reader.readAsDataURL(file);
  });
  startGameBtn.addEventListener('click',beginGame);
  restartBtn.addEventListener('click',resetGame);
  window.addEventListener('keydown',e=>{if(gameOver&&(e.key==='Enter'||e.key===' '))resetGame();});
})();
</script>
</body>
</html>
